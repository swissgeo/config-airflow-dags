---
# Summon secrets configuration for s3tables
# This file defines which AWS SSM parameters to fetch and expose as environment variables
#
# Usage:
#   summon -p ssm -f secrets.yml -e dev make upgrade-tables-prod
#

# Default common section
common: {}

# dev credentials
dev:
  AWS_PROFILE: swisstopo-swissgeo-dev
  AWS_REGION: eu-central-1
  RAW_TABLE_BUCKET_ARN: !var /amazon-s3tables/dev/buckets/raw/arn --profile swisstopo-swissgeo-dev
  SANITIZE_TABLE_BUCKET_ARN: !var /amazon-s3tables/dev/buckets/sanitize/arn --profile swisstopo-swissgeo-dev
  LOAD_TABLE_BUCKET_ARN: !var /amazon-s3tables/dev/buckets/load/arn --profile swisstopo-swissgeo-dev
