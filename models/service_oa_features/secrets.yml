---
# Summon secrets configuration for RDS database credentials
# This file defines which AWS SSM parameters to fetch and expose as environment variables
#
# Usage:
#   summon -p ssm -f secrets.yml -e services-dev make db-upgrade-prod
#
# See https://github.com/cyberark/summon?tab=readme-ov-file#flags

# Default common section
common: {}

# services-dev credentials
services-dev:
  PGUSER: !var /service-oa-features/dev/db-user-name --profile swisstopo-swissgeo-dev
  PGPASSWORD: !var /service-oa-features/dev/db-user-password --profile swisstopo-swissgeo-dev
  PGDATABASE: !var /service-oa-features/dev/db-name --profile swisstopo-swissgeo-dev
  K8SCONTEXT: "swissgeo/dev-green"

# services-int credentials
services-dint:
  PGUSER: !var /service-oa-features/int/db-user-name --profile swisstopo-swissgeo-dev
  PGPASSWORD: !var /service-oa-features/int/db-user-password --profile swisstopo-swissgeo-dev
  PGDATABASE: !var /service-oa-features/int/db-name --profile swisstopo-swissgeo-dev
  K8SCONTEXT: "swissgeo/int-green"

# services-prod credentials
services-prod:
  PGUSER: !var /service-oa-features/prod/db-user-name --profile swisstopo-swissgeo-dev
  PGPASSWORD: !var /service-oa-features/prod/db-user-password --profile swisstopo-swissgeo-dev
  PGDATABASE: !var /service-oa-features/prod/db-name --profile swisstopo-swissgeo-dev
  K8SCONTEXT: "swissgeo/prod-blue" # potentially also swissgeo/prod-green
