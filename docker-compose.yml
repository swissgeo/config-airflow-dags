services:
  moto-server:
    image: motoserver/moto
    ports:
      - "9090:5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot service that creates the S3 buckets on moto-server. It runs on every
  # `docker compose up` since moto-server has no persistence and starts empty.
  moto-init:
    image: amazon/aws-cli
    container_name: moto-init
    depends_on:
      moto-server:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=motoadmin
      - AWS_SECRET_ACCESS_KEY=motoadmin
      - AWS_DEFAULT_REGION=eu-central-1
    entrypoint: >
      aws --endpoint-url=http://moto-server:5000 s3 mb s3://raw || true;
    restart: "no"

  iceberg-rest:
    image: tabulario/iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://raw/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://moto-server:5000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: motoadmin
      AWS_SECRET_ACCESS_KEY: motopassword
      AWS_REGION: us-east-1
    depends_on:
      moto-init:
        condition: service_completed_successfully
